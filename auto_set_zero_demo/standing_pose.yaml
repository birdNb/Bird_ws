# =============================================================================
# 当前站立姿态快照（ROS2 default_bt standing → standby）
# 采集时间: 2026-08-26 11:24:24 CST
# 机型: PiPlus S-12L8A0G2H1W（23 DoF，含 waist_yaw）
# 上层: current_mode=default_bt, current_state=standby
#
# 站立指令来源: BFM policy default_pose
#   /home/nvidia/action_library/policy/bfm/bfm.yaml
# 实测来源: /joint_states（URDF 空间，已含 direction + urdf_offset）
#
# 字段:
#   cmd_q       站立位置指令 [rad]
#   measured_q  当前反馈位置 [rad]
#   offset_q    相对指令的位置偏移 = measured_q - cmd_q [rad]
#
# 注意:
#   offset_q 是跟指令的跟踪残差，不是 pd.yaml / joints.yaml 的 urdf_offset。
#   urdf_offset 是电机零 → URDF 的固定映射，调零时只读不改。

robot_type: S-12L8A0G2H1W
source:
  policy: bfm
  command: default_pose
  topic: /joint_states
  controller_state: standby

# 与 /joint_states、joints.yaml 相同的硬件顺序
joint_names:
  - l_ankle_roll_joint
  - l_ankle_pitch_joint
  - l_calf_joint
  - l_thigh_joint
  - l_hip_roll_joint
  - l_hip_pitch_joint
  - r_ankle_roll_joint
  - r_ankle_pitch_joint
  - r_calf_joint
  - r_thigh_joint
  - r_hip_roll_joint
  - r_hip_pitch_joint
  - l_shoulder_pitch_joint
  - l_shoulder_roll_joint
  - l_upper_arm_joint
  - l_elbow_joint
  - r_shoulder_pitch_joint
  - r_shoulder_roll_joint
  - r_upper_arm_joint
  - r_elbow_joint
  - head_yaw_joint
  - head_pitch_joint
  - waist_yaw_joint

# 站立位置指令（按上面 joint_names 重排后的 BFM default_pose）
cmd_q:
  [0.00, -0.40, 0.65, 0.00, 0.00, -0.25,
   0.00, -0.40, 0.65, 0.00, 0.00, -0.25,
   0.18, 0.15, 0.00, -0.50,
   0.18, -0.15, 0.00, -0.50,
   0.00, 0.00,
   0.00]


# BFM 原顺序（policy joint_names / default_pose，未重排）
bfm_order:
  joint_names:
    [r_hip_pitch_joint, r_hip_roll_joint, r_thigh_joint, r_calf_joint,
     r_ankle_pitch_joint, r_ankle_roll_joint,
     l_hip_pitch_joint, l_hip_roll_joint, l_thigh_joint, l_calf_joint,
     l_ankle_pitch_joint, l_ankle_roll_joint,
     waist_yaw_joint,
     r_shoulder_pitch_joint, r_shoulder_roll_joint, r_upper_arm_joint, r_elbow_joint,
     l_shoulder_pitch_joint, l_shoulder_roll_joint, l_upper_arm_joint, l_elbow_joint,
     head_yaw_joint, head_pitch_joint]
  cmd_q:
    [-0.25, 0.00, 0.00, 0.65, -0.40, 0.00,
     -0.25, 0.00, 0.00, 0.65, -0.40, 0.00,
     0.00,
     0.18, -0.15, 0.00, -0.50,
     0.18,  0.15, 0.00, -0.50,
     0.00, 0.00]

# === right_arm_limit_scan (generated) ===
# 生成时间: 2026-08-28 15:35:56
# 仅记录撞到硬件限位时的 URDF 位置 [rad]，保留两位小数（角度精度 0.5°）
# seek_dir: 电机顺时针对应的 URDF 方向；+ 表示往 URDF 增大到限位，- 表示往减小到限位
right_arm_limit_q:
  r_elbow_joint: 1.78  # seek_dir +1 → 往 + 到限位
  r_upper_arm_joint: -2.64  # seek_dir -1 → 往 - 到限位
  r_shoulder_roll_joint: -3.06  # seek_dir -1 → 往 - 到限位
  r_shoulder_pitch_joint: -4.21  # seek_dir -1 → 往 - 到限位
# === end right_arm_limit_scan ===

# === waist_neck_limit_scan (generated) ===
# 生成时间: 2026-08-28 15:35:59
# 仅记录撞到硬件限位时的 URDF 位置 [rad]，保留两位小数（角度精度 0.5°）
# seek_dir: 电机顺时针对应的 URDF 方向；+ 表示往 URDF 增大到限位，- 表示往减小到限位
waist_neck_limit_q:
  head_pitch_joint: -0.92  # seek_dir -1 → 往 - 到限位
  head_yaw_joint: 1.48  # seek_dir +1 → 往 + 到限位
  waist_yaw_joint: -2.64  # seek_dir -1 → 往 - 到限位
# === end waist_neck_limit_scan ===
