terrain:
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.0
  mesh_type: plane
  horizontal_scale: 0.1
  vertical_scale: 0.005
  border_size: 40
  curriculum: false
  measure_heights: false
  measured_points_x:
  - 0.0
  measured_points_y:
  - 0.0
  selected: false
  terrain_kwargs: null
  max_init_terrain_level: 9
  terrain_length: 8.0
  terrain_width: 8.0
  num_rows: 10
  num_cols: 20
  terrain_types:
  - flat
  - rough
  - low_obst
  - smooth_slope
  - rough_slope
  terrain_proportions:
  - 0.2
  - 0.6
  - 0.2
  - 0.0
  - 0.0
  slope_treshold: 0.75
obs:
  use_obs_filter: true
  root_height_obs: true
  obs_dict:
    actor_obs:
    - base_ang_vel
    - projected_gravity
    - dof_pos
    - dof_vel
    - actions
    - history_actor
    - max_local_self
    critic_obs:
    - max_local_self
  obs_auxiliary:
    history_actor:
      base_ang_vel: 4
      projected_gravity: 4
      dof_pos: 4
      dof_vel: 4
      actions: 4
  obs_scales:
    actions: 1.0
    dof_pos: 1.0
    dof_vel: 1.0
    max_local_self: 1.0
    base_lin_vel: 1.0
    base_ang_vel: 0.25
    projected_gravity: 1.0
    history_actor: 1.0
  noise_scales:
    base_lin_vel: 0.0
    base_ang_vel: 0.2
    projected_gravity: 0.05
    dof_pos: 0.01
    dof_vel: 0.5
    actions: 0.0
    max_local_self: 0.0
    history_actor: 0.0
  add_noise_currculum: false
  noise_initial_value: 0.05
  noise_value_max: 1.0
  noise_value_min: 1.0e-05
  soft_dof_pos_curriculum_degree: 1.0e-05
  soft_dof_pos_curriculum_level_down_threshold: 40
  soft_dof_pos_curriculum_level_up_threshold: 42
  obs_dims:
  - base_lin_vel: 3
  - base_ang_vel: 3
  - projected_gravity: 3
  - dof_pos: ${robot.dof_obs_size}
  - dof_vel: ${robot.dof_obs_size}
  - actions: ${robot.dof_obs_size}
  - max_local_self: ${eval:'(3 + 6 + 3 + 3) * (${robot.num_bodies} + ${robot.motion.nums_extend_bodies})
      + 1 - 3 - 1'}
  post_compute_config: {}
callbacks:
  im_eval:
    _target_: humanoidverse.trl.callbacks.im_eval_callback.ImEvalCallback
    eval_frequency: 500
exp_base: ${hydra:runtime.choices.exp}
exp_var: piplus_lse
experiment_name: ${exp_base}_${exp_var}
experiment_dir: ${base_dir}/${project_name}/${experiment_name}-${timestamp}
num_envs: 50
project_name: BFMZeroPiPlus
