<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=1.0, maximum-scale=5.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>机器人控制系统 - Robot Control</title>
    <link rel="stylesheet" href="{{ url_for('serve_common_static', filename='css/controls.css') }}?v=2.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/robot.css') }}?v=2.0">
</head>
<body>
    <!-- Landscape hint for mobile/tablet -->
    <div id="landscape-hint" class="landscape-hint">
        <div class="landscape-hint-content">
            <div class="rotate-icon">📱</div>
            <p>建议横屏使用</p>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>🤖 机器人控制</h1>
            <div id="connection-status" class="status disconnected">未连接</div>
        </header>

        <main>
            <!-- Mode Switcher -->
            <div class="mode-switcher">
                <div class="mode-info">
                    <span class="mode-label">当前模式:</span>
                    <span id="current-mode" class="current-mode self">自控模式</span>
                </div>
                <div class="mode-buttons">
                    <button id="mode-self-btn" class="mode-btn self" disabled>自控模式</button>
                    <button id="mode-group-btn" class="mode-btn group">群控模式</button>
                </div>
            </div>

            <!-- Joystick Controls -->
            <div class="joystick-control-section">
                <div class="joystick-container">
                    <div class="joystick-wrapper">
                        <div class="joystick-label">左摇杆</div>
                        <canvas id="left-joystick" width="150" height="150"></canvas>
                        <div class="joystick-values">
                            <span>X: <span id="left-x">0.00</span></span>
                            <span>Y: <span id="left-y">0.00</span></span>
                        </div>
                    </div>

                    <!-- Center Buttons -->
                    <div class="center-buttons">
                        <div class="button-row">
                            <button class="gamepad-btn small-btn clickable-btn" data-key="BACK">BACK</button>
                            <button class="gamepad-btn small-btn clickable-btn" data-key="START">START</button>
                        </div>
                        <div class="button-row">
                            <button class="gamepad-btn small-btn clickable-btn" data-key="TURBO">TURBO</button>
                            <button class="gamepad-btn small-btn clickable-btn" data-key="SHIFT">SHIFT</button>
                        </div>
                        <div class="button-row face-buttons">
                            <div class="face-btn-layout">
                                <button class="gamepad-btn face-btn clickable-btn" data-btn="Y" data-key="Y">Y</button>
                                <div class="face-btn-row">
                                    <button class="gamepad-btn face-btn clickable-btn" data-btn="X" data-key="X">X</button>
                                    <button class="gamepad-btn face-btn clickable-btn" data-btn="B" data-key="B">B</button>
                                </div>
                                <button class="gamepad-btn face-btn clickable-btn" data-btn="A" data-key="A">A</button>
                            </div>
                        </div>
                    </div>

                    <div class="joystick-wrapper">
                        <div class="joystick-label">右摇杆</div>
                        <canvas id="right-joystick" width="150" height="150"></canvas>
                        <div class="joystick-values">
                            <span>X: <span id="right-x">0.00</span></span>
                            <span>Y: <span id="right-y">0.00</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Head Control -->
            <div class="head-control-section">
                <div class="head-control-container">
                    <div class="joystick-wrapper">
                        <div class="joystick-label">头部方向</div>
                        <canvas id="head-joystick" width="150" height="150"></canvas>
                        <div class="joystick-values">
                            <span>Yaw: <span id="head-yaw">0.00</span></span>
                            <span>Pitch: <span id="head-pitch">0.00</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Command Buttons (Dynamically loaded) -->
            <div class="commands-section">
                <h2>手势命令</h2>
                <div id="commands-container">
                    <!-- Commands will be loaded here dynamically -->
                    <div class="loading">加载命令中...</div>
                </div>
            </div>

            <!-- Gamepad Info -->
            <div class="gamepad-info">
                <div id="gamepad-status">
                    <span class="gamepad-icon">🎮</span>
                    <span id="gamepad-text">未检测到物理手柄</span>
                </div>
                <p class="hint">💡 支持触摸屏、鼠标拖动虚拟摇杆，或连接物理游戏手柄</p>
            </div>
        </main>

        <footer>
            <p>机器人控制系统 v2.0 | Robot Control System</p>
        </footer>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('serve_common_static', filename='js/joystick.js') }}"></script>
    <script src="{{ url_for('serve_common_static', filename='js/base-controller.js') }}"></script>
    <script src="{{ url_for('serve_common_static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/mode-switcher.js') }}"></script>
    <script>
        // Initialize robot app (with mode switcher)
        document.addEventListener('DOMContentLoaded', () => {
            window.app = new AppController({ hasModeSwitcher: true });

            // Initialize mode switcher
            window.app.modeSwitcher = new ModeSwitcher();

            autoHideLandscapeHint();
        });
    </script>
</body>
</html>
