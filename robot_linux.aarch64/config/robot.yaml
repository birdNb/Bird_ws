# Robot Configuration
# 机器人端配置文件

# 机器人信息
robot_id: "robot_001"
robot_name: "机器人1"

# 日志配置
log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL

# HTTP 服务器
http_host: '0.0.0.0'
http_port: 45000

# UDP 配置
udp_receive_port: 48888      # UDP 接收端口（群控命令）
udp_heartbeat_port: 48889    # UDP 心跳端口

# 心跳配置
heartbeat_interval: 2        # 心跳发送间隔（秒）

# 默认模式
default_mode: 'group'        # 'self' 或 'group'      

# ROS 配置
ros_topic: '/joy_input'
ros_head_topic: '/pi_plus_absolute'
ros_queue_size: 10

# 头部控制范围（弧度）
head_yaw_range: [-1.57, 1.57]    # 左右转动范围 (-90° 到 90°)
head_pitch_range: [-1.40, 1.40]  # 上下转动范围 (-80° 到 80°)

# 摇杆超时设置
joystick_timeout: 0.1        # 摇杆超时时间（秒）
